<!DOCTYPE html>
<html>

<head>

    <title>Sentiment Analysis Chatbot</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Sentiment Analysis Chatbot</h2>

        <form method="POST">

            <textarea name="message" placeholder="Type your message here"></textarea>

            <br>

            <button type="submit">Analyze</button>

        </form>

        <div class="result">

            <h3>User Message:</h3>
            <p>{{ user_message }}</p>

            <h3>Detected Sentiment:</h3>
            <p>{{ sentiment }}</p>

            <h3>Bot Response:</h3>
            <p>{{ bot_response }}</p>

        </div>

    </div>

</body>

</html>
